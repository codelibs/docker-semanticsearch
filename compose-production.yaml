services:
  https-portal:
    image: steveltn/https-portal:1
    restart: always
    ports:
      - '80:80'
      - '443:443'
    depends_on:
      fess01:
        condition: service_healthy
    environment:
      DOMAINS: '${DOMAIN:-semantic.codelibs.org} -> http://fess01:8080'
      STAGE: production
      CUSTOM_NGINX_SERVER_CONFIG_BLOCK: |
          add_header X-Frame-Options SAMEORIGIN;
    networks:
      - semantic_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    volumes:
      - ./data/https-portal/ssl_certs:/var/lib/https-portal
      # https-portal applies a per-domain vhost template named <domain>.ssl.conf.erb.
      # bin/setup.sh seeds data/https-portal/conf/<domain>.ssl.conf.erb from the
      # default template whenever DOMAIN differs from semantic.codelibs.org, so this
      # mount resolves to a file rather than an auto-created directory.
      - ./data/https-portal/conf/${DOMAIN:-semantic.codelibs.org}.ssl.conf.erb:/var/lib/nginx-conf/${DOMAIN:-semantic.codelibs.org}.ssl.conf.erb:ro

  fess01:
    # https-portal terminates TLS and proxies over the compose network, so Fess
    # itself does not need a public listener. `!override` replaces the base list
    # instead of appending to it (Compose merges `ports` by concatenation, which
    # would leave both binds fighting over 8080). Requires Compose v2.24+.
    ports: !override
      - "127.0.0.1:8080:8080"

  search01:
    environment:
      OPENSEARCH_JAVA_OPTS: -Xms${OPENSEARCH_HEAP_PROD:-3g} -Xmx${OPENSEARCH_HEAP_PROD:-3g}
