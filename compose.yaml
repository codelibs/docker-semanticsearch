services:
  search01:
    # Fess 15.8 always writes "index.knn": true and a content_chunk_vector
    # (knn_vector) mapping into the document index, whether or not the chunk
    # feature is enabled -- so the k-NN plugin is mandatory, not optional.
    # ghcr.io/codelibs/fess-opensearch ships it (plus the Fess analyzers).
    image: ghcr.io/codelibs/fess-opensearch:${OPENSEARCH_VERSION:-3.8.0}
    container_name: search01
    restart: always
    environment:
      - node.name=search01
      - discovery.seed_hosts=search01
      - cluster.initial_cluster_manager_nodes=search01
      - cluster.name=fess-search
      - bootstrap.memory_lock=true
      # The `ml` role lets ML Commons host the embedding model in-cluster. Fess
      # calls its _predict API directly; there is no ingest pipeline in 15.8.
      - node.roles=cluster_manager,data,ingest,ml
      - "OPENSEARCH_JAVA_OPTS=-Xms${OPENSEARCH_HEAP:-2g} -Xmx${OPENSEARCH_HEAP:-2g}"
      - "DISABLE_INSTALL_DEMO_CONFIG=true"
      - "DISABLE_SECURITY_PLUGIN=true"
      - "FESS_DICTIONARY_PATH=/usr/share/opensearch/config/dictionary"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    volumes:
      - ./data/opensearch/usr/share/opensearch/data:/usr/share/opensearch/data
      - ./data/opensearch/usr/share/opensearch/config/dictionary:/usr/share/opensearch/config/dictionary
    ports:
      # Bind to host loopback only: OpenSearch here runs with security disabled.
      # Inter-container traffic uses the docker network (search01:9200); this publish
      # is only for host-local debugging. Do not expose 9200 on a public interface.
      - "127.0.0.1:9200:9200"
    networks:
      - semantic_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # One-shot: register and deploy the embedding model in OpenSearch ML Commons,
  # then hand its generated model id to fess01 through the shared ./data/semantic
  # volume. Fess 15.8 embeds by calling _plugins/_ml/models/<id>/_predict, so the
  # model is the only thing that has to exist on the OpenSearch side.
  init-semantic:
    image: alpine:3.21
    depends_on:
      search01:
        condition: service_healthy
    environment:
      - OPENSEARCH_URL=http://search01:9200
      - MODEL_NAME=${MODEL_NAME:-huggingface/sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      - MODEL_VERSION=${MODEL_VERSION:-1.0.1}
      - MODEL_FORMAT=${MODEL_FORMAT:-TORCH_SCRIPT}
      - MODEL_DIMENSION=${MODEL_DIMENSION:-384}
      - MODEL_ID_FILE=/semantic/model_id
      - MAX_WAIT=${MODEL_MAX_WAIT:-900}
    volumes:
      - ./bin/setup-semantic.sh:/setup-semantic.sh:ro
      - ./data/semantic:/semantic
    entrypoint: ["/bin/sh", "-c", "apk add --no-cache curl jq >/dev/null && exec sh /setup-semantic.sh"]
    restart: "no"
    networks:
      - semantic_net

  fess01:
    image: ghcr.io/codelibs/fess:${FESS_VERSION:-15.8.0}
    container_name: fess01
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      search01:
        condition: service_healthy
      init-semantic:
        condition: service_completed_successfully
    environment:
      SEARCH_ENGINE_HTTP_URL: "http://search01:9200"
      FESS_DICTIONARY_PATH: "/usr/share/opensearch/config/dictionary/"
      # No FESS_PLUGINS: semantic search is part of Fess core from 15.8 on.
      # fess-webapp-semantic-search is deprecated and must NOT be installed --
      # its index rewrite rules collide with the core knn settings and its
      # `semantic` searcher is not the core `semantic_chunk` one.
      #
      # Two property channels are in play:
      #   -Dfess.config.*  -> fess_config.properties overrides
      #   -Dfess.system.*  -> system.properties (the ONLY channel content_chunker.*
      #                       is read from; -Dfess.config.content_chunker.* is ignored)
      # A value written into /opt/fess/system.properties takes precedence over the
      # matching -Dfess.system.* here, so keep content_chunker.* out of that file
      # and drive it from .env.
      #
      # The dynamic embedding.opensearch.model.id is injected by bin/fess-entrypoint.sh
      # from the shared /semantic/model_id file written by the init-semantic service.
      FESS_JAVA_OPTS: >-
        -Dfess.config.crawler.document.cache.enabled=false
        -Dfess.config.adaptive.load.control=20
        -Dfess.config.query.facet.fields=label,host
        -Dfess.config.query.additional.response.fields=searcher
        -Dfess.config.query.additional.api.response.fields=searcher
        -Dfess.config.index.user.initial_password=${FESS_ADMIN_PASSWORD:-admin}
        -Dfess.system.content_chunker.enabled=true
        -Dfess.system.content_chunker.search.enabled=true
        -Dfess.system.content_chunker.embedding.name=opensearch
        -Dfess.system.content_chunker.embedding.dimension=${MODEL_DIMENSION:-384}
        -Dfess.system.content_chunker.length.chunk_size=${CHUNK_SIZE:-250}
        -Dfess.system.content_chunker.length.overlap=${CHUNK_OVERLAP:-0}
        -Dfess.system.content_chunker.max_chunks_per_document=${MAX_CHUNKS_PER_DOC:-2000}
        -Dfess.system.content_chunker.search.knn.method=${KNN_METHOD:-hnsw}
        -Dfess.system.content_chunker.search.knn.engine=${KNN_ENGINE:-lucene}
        -Dfess.system.content_chunker.search.knn.space_type=${KNN_SPACE_TYPE:-cosinesimil}
        -Dfess.system.content_chunker.search.knn.k=${KNN_K:-100}
        -Dfess.system.content_chunker.search.min_score=${SEMANTIC_MIN_SCORE:-0.5}
        -Dfess.system.content_chunker.job.concurrency=${CHUNK_JOB_CONCURRENCY:-2}
        -Dfess.system.content_chunker.job.bulk_size=${CHUNK_JOB_BULK_SIZE:-20}
    entrypoint: ["sh", "/fess-entrypoint.sh"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/v2/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    volumes:
      - ./bin/fess-entrypoint.sh:/fess-entrypoint.sh:ro
      - ./data/semantic:/semantic:ro
      - ./data/fess/opt/fess:/opt/fess
      - ./data/fess/var/lib/fess:/var/lib/fess
      - ./data/fess/var/log/fess:/var/log/fess
      - ./data/fess/usr/share/fess/app/WEB-INF/plugin:/usr/share/fess/app/WEB-INF/plugin
      - ./data/fess/usr/share/fess/app/themes/${THEME_NAME:-semanticlens}:/usr/share/fess/app/themes/${THEME_NAME:-semanticlens}
    networks:
      - semantic_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # One-shot: after fess01 is healthy, verify that the document index really carries
  # the ANN chunk-vector mapping, then enable the "Content Chunk Vector Indexer"
  # scheduler job (Fess ships it disabled, at 0 13 * * *). Without that job no
  # chunks and no vectors are ever produced, so semantic search would stay silently
  # empty. Idempotent: an already-enabled job with the requested cron is left alone.
  init-fess-chunk:
    image: alpine:3.21
    depends_on:
      fess01:
        condition: service_healthy
    environment:
      - FESS_URL=http://fess01:8080
      - OPENSEARCH_URL=http://search01:9200
      - FESS_ADMIN_USER=admin
      - FESS_ADMIN_PASSWORD=${FESS_ADMIN_PASSWORD:-admin}
      - "CHUNK_JOB_CRON=${CHUNK_JOB_CRON:-0 * * * *}"
      - CHUNK_JOB_AUTOSTART=${CHUNK_JOB_AUTOSTART:-true}
      - CHUNK_JOB_START_DELAY=${CHUNK_JOB_START_DELAY:-35}
      - EXPECTED_DIMENSION=${MODEL_DIMENSION:-384}
      - EXPECTED_ENGINE=${KNN_ENGINE:-lucene}
      - MAX_WAIT=${CHUNK_SETUP_MAX_WAIT:-300}
    volumes:
      - ./bin/setup-fess-chunk.sh:/setup-fess-chunk.sh:ro
    entrypoint: ["/bin/sh", "-c", "apk add --no-cache curl jq >/dev/null && exec sh /setup-fess-chunk.sh"]
    restart: "no"
    networks:
      - semantic_net

networks:
  semantic_net:
    driver: bridge
