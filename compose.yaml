services:
  search01:
    image: ghcr.io/codelibs/fess-opensearch:${OPENSEARCH_VERSION:-3.7.0}
    container_name: search01
    restart: always
    environment:
      - node.name=search01
      - discovery.seed_hosts=search01
      - cluster.initial_cluster_manager_nodes=search01
      - cluster.name=fess-search
      - bootstrap.memory_lock=true
      - node.roles=cluster_manager,data,ingest,ml
      - "OPENSEARCH_JAVA_OPTS=-Xms${OPENSEARCH_HEAP:-2g} -Xmx${OPENSEARCH_HEAP:-2g}"
      - "DISABLE_INSTALL_DEMO_CONFIG=true"
      - "DISABLE_SECURITY_PLUGIN=true"
      - "FESS_DICTIONARY_PATH=/usr/share/opensearch/config/dictionary"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    volumes:
      - ./data/opensearch/usr/share/opensearch/data:/usr/share/opensearch/data
      - ./data/opensearch/usr/share/opensearch/config/dictionary:/usr/share/opensearch/config/dictionary
    ports:
      # Bind to host loopback only: OpenSearch here runs with security disabled.
      # Inter-container traffic uses the docker network (search01:9200); this publish
      # is only for host-local debugging. Do not expose 9200 on a public interface.
      - "127.0.0.1:9200:9200"
    networks:
      - semantic_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  init-semantic:
    image: alpine:3.21
    depends_on:
      search01:
        condition: service_healthy
    environment:
      - OPENSEARCH_URL=http://search01:9200
      - MODEL_NAME=${MODEL_NAME:-huggingface/sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      - MODEL_VERSION=${MODEL_VERSION:-1.0.1}
      - MODEL_FORMAT=${MODEL_FORMAT:-TORCH_SCRIPT}
      - MODEL_DIMENSION=${MODEL_DIMENSION:-384}
      - PIPELINE_NAME=neural_pipeline
      - MODEL_ID_FILE=/semantic/model_id
      - CHUNK_TOKEN_LIMIT=${CHUNK_TOKEN_LIMIT:-100}
      - CHUNK_OVERLAP_RATE=${CHUNK_OVERLAP_RATE:-0.1}
      - MAX_WAIT=${MAX_WAIT:-900}
    volumes:
      - ./bin/setup-semantic.sh:/setup-semantic.sh:ro
      - ./data/semantic:/semantic
    entrypoint: ["/bin/sh", "-c", "apk add --no-cache curl jq >/dev/null && exec sh /setup-semantic.sh"]
    restart: "no"
    networks:
      - semantic_net

  fess01:
    image: ghcr.io/codelibs/fess:${FESS_VERSION:-15.7.0}
    container_name: fess01
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      search01:
        condition: service_healthy
      init-semantic:
        condition: service_completed_successfully
    environment:
      SEARCH_ENGINE_HTTP_URL: "http://search01:9200"
      FESS_DICTIONARY_PATH: "/usr/share/opensearch/config/dictionary/"
      FESS_PLUGINS: "fess-webapp-semantic-search:${SEMANTIC_PLUGIN_VERSION:-15.7.0}"
      # fess_config.properties overrides (-Dfess.config.*), hybrid rank fusion
      # (-Drank.fusion.searchers, a plain system property), and the static
      # fess.semantic_search.* properties (read by the plugin via System.getProperty).
      # The dynamic content.model_id is injected by bin/fess-entrypoint.sh from the
      # shared /semantic/model_id file written by the init-semantic service.
      FESS_JAVA_OPTS: >-
        -Dfess.config.crawler.document.cache.enabled=false
        -Dfess.config.adaptive.load.control=20
        -Dfess.config.query.facet.fields=label,host
        -Dfess.config.query.additional.response.fields=searcher
        -Dfess.config.query.additional.api.response.fields=searcher
        -Dfess.config.index.user.initial_password=${FESS_ADMIN_PASSWORD:-admin}
        -Drank.fusion.searchers=default,semantic
        -Dfess.semantic_search.pipeline=neural_pipeline
        -Dfess.semantic_search.content.nested_field=content_vector
        -Dfess.semantic_search.content.chunk_field=content_chunk
        -Dfess.semantic_search.content.field=knn
        -Dfess.semantic_search.content.dimension=${MODEL_DIMENSION:-384}
        -Dfess.semantic_search.content.method=${MODEL_METHOD:-hnsw}
        -Dfess.semantic_search.content.engine=${MODEL_ENGINE:-lucene}
        -Dfess.semantic_search.content.space_type=${MODEL_SPACE_TYPE:-cosinesimil}
        -Dfess.semantic_search.min_score=${SEMANTIC_MIN_SCORE:-0.5}
    entrypoint: ["sh", "/fess-entrypoint.sh"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/v2/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    volumes:
      - ./bin/fess-entrypoint.sh:/fess-entrypoint.sh:ro
      - ./data/semantic:/semantic:ro
      - ./data/fess/opt/fess:/opt/fess
      - ./data/fess/var/lib/fess:/var/lib/fess
      - ./data/fess/var/log/fess:/var/log/fess
      - ./data/fess/usr/share/fess/app/WEB-INF/plugin:/usr/share/fess/app/WEB-INF/plugin
      - ./data/fess/usr/share/fess/app/themes/${THEME_NAME:-semanticlens}:/usr/share/fess/app/themes/${THEME_NAME:-semanticlens}
    networks:
      - semantic_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # One-shot: after fess01 is healthy, ensure the document index carries the
  # semantic vector mapping. Fess core creates the document index before the
  # semantic plugin registers its index rewrite rules (DI boot order), so the
  # auto-created index lacks content_vector/knn/default_pipeline. This triggers a
  # Fess "Admin > Maintenance > Reindex" once to re-create the index with the
  # plugin's mapping and swap the aliases. Idempotent: it no-ops when the vector
  # field is already present, so it is safe on every restart.
  init-fess-index:
    image: alpine:3.21
    depends_on:
      fess01:
        condition: service_healthy
    environment:
      - FESS_URL=http://fess01:8080
      - OPENSEARCH_URL=http://search01:9200
      - FESS_ADMIN_USER=admin
      - FESS_ADMIN_PASSWORD=${FESS_ADMIN_PASSWORD:-admin}
      - VECTOR_FIELD=content_vector
      - MAX_WAIT=${MAX_WAIT:-300}
    volumes:
      - ./bin/setup-fess-index.sh:/setup-fess-index.sh:ro
    entrypoint: ["/bin/sh", "-c", "apk add --no-cache curl >/dev/null && exec sh /setup-fess-index.sh"]
    restart: "no"
    networks:
      - semantic_net

networks:
  semantic_net:
    driver: bridge
